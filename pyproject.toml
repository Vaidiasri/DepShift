[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "depshift"
version = "0.1.0"
description = "Autonomous dependency migration & remediation MCP server"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "DepShift Team" }
]
dependencies = [
    "fastmcp>=0.4.0",
    "pydantic>=2.0.0",
    "gitpython>=3.1.40",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
depshift = "depshift.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/depshift"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
